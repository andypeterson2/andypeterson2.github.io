a, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">-1.22</text><text x="122" y="108" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="700" fill="#000" text-anchor="end">TECHWOLF</text><rect x="228" y="96" width="262.07999999999987" height="10" fill="#000" stroke="#000" stroke-width="1"/><rect x="198.96000000000015" y="109" width="29.03999999999985" height="10" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="496.07999999999987" y="105" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="start">+10.92</text><text x="192.96000000000015" y="118" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">-1.21</text><rect x="34" y="148" width="14" height="10" fill="#000" stroke="#000" stroke-width="1"/><text x="53" y="156" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">gained by fine-tuning, against stock</text><rect x="272.6" y="148" width="14" height="10" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="291.6" y="156" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">given back by quantizing to int8</text><text x="34" y="176" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Both bars are RP@5 points on one axis, so the two are directly comparable. Fine-tuning buys 8 to 13 points; quantizing</text><text x="34" y="189" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">hands back at most 1.22, and the file that ships is the int8 one.</text></g><text x="0" y="240" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Retrieval precision at 5, ranking all 13,891 ESCO 1.1.0 skills per sentence. TECH 338, HOUSE 262, TECHWOLF 326</text><text x="0" y="253" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">held-out queries.</text><text x="0" y="266" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Both arms are the mean of the same three seeds. A negative bar is a loss against the fp32 model.</text></svg>
