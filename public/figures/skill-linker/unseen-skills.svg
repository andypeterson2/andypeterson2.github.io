<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Skills the model never trained on. hit@5 over 13,891 ESCO skills. One held-out run, one seed; the arms it is compared against cover three seeds, so the spread is known on one side of this and not the other."><title>Skills the model never trained on</title><desc>hit@5 over 13,891 ESCO skills. One held-out run, one seed; the arms it is compared against cover three seeds, so the spread is known on one side of this and not the other.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="300" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Skills the model never trained on</text><g transform="translate(0,26)"><line x1="34" y1="154" x2="632" y2="154" stroke="#000" stroke-width="1" opacity="1"/><text x="30" y="157" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">0</text><line x1="34" y1="127.6" x2="632" y2="127.6" stroke="#000" stroke-width="1" opacity="0.25"/><text x="30" y="130.6" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">10</text><line x1="34" y1="101.19999999999999" x2="632" y2="101.19999999999999" stroke="#000" stroke-width="1" opacity="0.25"/><text x="30" y="104.19999999999999" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">20</text><line x1="34" y1="74.8" x2="632" y2="74.8" stroke="#000" stroke-width="1" opacity="0.25"/><text x="30" y="77.8" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">30</text><line x1="34" y1="48.39999999999999" x2="632" y2="48.39999999999999" stroke="#000" stroke-width="1" opacity="0.25"/><text x="30" y="51.39999999999999" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">40</text><line x1="34" y1="22" x2="632" y2="22" stroke="#000" stroke-width="1" opacity="0.25"/><text x="30" y="25" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="end">50</text><rect x="111.5" y="71.104" width="44" height="82.896" fill="#fff" stroke="#000" stroke-width="1"/><text x="133.5" y="67.104" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">31.4</text><rect x="161.5" y="43.59519999999999" width="44" height="110.40480000000001" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="183.5" y="39.59519999999999" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">41.8</text><rect x="211.5" y="44.5984" width="44" height="109.4016" fill="#000" stroke="#000" stroke-width="1"/><text x="233.5" y="57.5984" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">41.4</text><text x="183.5" y="168" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="700" fill="#000" text-anchor="middle">on skills it trained on</text><text x="183.5" y="181" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="middle">n = 1,414</text><rect x="410.5" y="65.0584" width="44" height="88.9416" fill="#fff" stroke="#000" stroke-width="1"/><text x="432.5" y="61.058400000000006" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">33.7</text><rect x="460.5" y="40.40079999999999" width="44" height="113.59920000000001" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="482.5" y="36.40079999999999" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#000" text-anchor="middle">43.0</text><rect x="510.5" y="43.54239999999999" width="44" height="110.45760000000001" fill="#000" stroke="#000" stroke-width="1"/><text x="532.5" y="56.54239999999999" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">41.8</text><text x="482.5" y="168" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="700" fill="#000" text-anchor="middle">on skills held out entirely</text><text x="482.5" y="181" font-family="Geneva, Verdana, sans-serif" font-size="9" font-weight="400" fill="#000" text-anchor="middle">n = 282</text><rect x="34" y="194" width="14" height="10" fill="#fff" stroke="#000" stroke-width="1"/><text x="53" y="202" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">stock MiniLM</text><rect x="138.2" y="194" width="14" height="10" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="157.2" y="202" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">fine-tuned on all skills</text><rect x="309.59999999999997" y="194" width="14" height="10" fill="#000" stroke="#000" stroke-width="1"/><text x="328.59999999999997" y="202" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">fine-tuned with these held out</text><text x="34" y="222" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Holding 2,765 skills and every sentence mentioning them out of training still leaves +8.16 hit@5 over stock on the</text><text x="34" y="235" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">skills it never saw (95% CI [+3.55, +12.77]), against +10.04 on the ones it did.</text></g><text x="0" y="286" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">hit@5 over 13,891 ESCO skills. One held-out run, one seed; the arms it is compared against cover three seeds, so the</text><text x="0" y="299" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">spread is known on one side of this and not the other.</text></svg>
