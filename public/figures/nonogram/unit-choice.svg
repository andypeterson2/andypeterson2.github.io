<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 238" width="640" height="238" role="img" aria-label="One circuit against one classical search, in three units. A 3x3 board with one solution, against 17,920 classical gate-steps on a single processor: 2^9 grids at the median predicate cost over every 3x3 board, rather than one puzzle's. Width times depth charges the circuit for qubits it holds idle, and the classical side for no width at all, which is most of the difference between the ends of this figure."><title>One circuit against one classical search, in three units</title><desc>A 3x3 board with one solution, against 17,920 classical gate-steps on a single processor: 2^9 grids at the median predicate cost over every 3x3 board, rather than one puzzle's. Width times depth charges the circuit for qubits it holds idle, and the classical side for no width at all, which is most of the difference between the ends of this figure.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="238" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">One circuit against one classical search, in three units</text><g transform="translate(0,26)"><line x1="158.58942476354943" y1="10" x2="158.58942476354943" y2="126" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="158.58942476354943" y="140" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">0.1x</text><line x1="320" y1="10" x2="320" y2="126" stroke="#000" stroke-width="2" /><text x="320" y="140" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">1x</text><line x1="481.41057523645054" y1="10" x2="481.41057523645054" y2="126" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="481.41057523645054" y="140" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">10x</text><rect x="200.1053553761564" y="18" width="119.89464462384359" height="20" fill="#000" stroke="#000" stroke-width="1"/><text x="102" y="32" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">two-qubit gates</text><text x="328" y="32" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">0.18x</text><rect x="308.8463716644453" y="52" width="11.153628335554686" height="20" fill="#000" stroke="#000" stroke-width="1"/><text x="102" y="66" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">all gates</text><text x="328" y="66" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">0.85x</text><rect x="320" y="86" width="94.51072885128355" height="20" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="102" y="100" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">qubit-layers</text><text x="422.51072885128355" y="100" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">3.85x</text><text x="110" y="160" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">left of the rule: cheaper than the classical search</text></g><text x="0" y="198" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">A 3x3 board with one solution, against 17,920 classical gate-steps on a single processor: 2^9 grids at the median</text><text x="0" y="211" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">predicate cost over every 3x3 board, rather than one puzzle's.</text><text x="0" y="224" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Width times depth charges the circuit for qubits it holds idle, and the classical side for no width at all, which is</text><text x="0" y="237" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">most of the difference between the ends of this figure.</text></svg>
