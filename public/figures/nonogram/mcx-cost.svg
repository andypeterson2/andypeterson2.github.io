<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 331" width="640" height="331" role="img" aria-label="One many-controlled X, with and without a qubit to borrow. The borrowed-qubit cost is exactly 6(c - 1) at every size; the ancilla-free path grows about c^2.4 to twenty controls, so the gap widens rather than holding at one factor. Transpiled to the device's basis with no coupling map, so this is synthesis alone, before any routing. The cost gap itself is long established — Barenco et al. 1995 give linear with borrowed work qubits against quadratic with none."><title>One many-controlled X, with and without a qubit to borrow</title><desc>The borrowed-qubit cost is exactly 6(c - 1) at every size; the ancilla-free path grows about c^2.4 to twenty controls, so the gap widens rather than holding at one factor. Transpiled to the device's basis with no coupling map, so this is synthesis alone, before any routing. The cost gap itself is long established — Barenco et al. 1995 give linear with borrowed work qubits against quadratic with none.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="331" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">One many-controlled X, with and without a qubit to borrow</text><g transform="translate(0,26)"><line x1="56" y1="174" x2="490" y2="174" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="178" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10</text><line x1="56" y1="120.66666666666666" x2="490" y2="120.66666666666666" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="124.66666666666666" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">100</text><line x1="56" y1="67.33333333333333" x2="490" y2="67.33333333333333" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="71.33333333333333" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">1,000</text><line x1="56" y1="14" x2="490" y2="14" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="18" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10,000</text><line x1="56" y1="14" x2="56" y2="174" stroke="#000"/><line x1="56" y1="174" x2="490" y2="174" stroke="#000"/><text x="56" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">3</text><text x="95.45454545454545" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">5</text><text x="154.63636363636363" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">8</text><text x="213.8181818181818" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">11</text><text x="292.72727272727275" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">15</text><text x="391.3636363636364" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">20</text><text x="490" y="188" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">25</text><text x="273" y="202" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">controls</text><path d="M56,166.2065047638273 L95.45454545454545,124.70510474336632 L154.63636363636363,99.2586378249843 L213.8181818181818,80.59844778755507 L292.72727272727275,63.34312316559067 L391.3636363636364,47.880610397045416 L490,41.97970169902075" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="56" cy="166.2065047638273" r="3" fill="#fff" stroke="#000"/><circle cx="95.45454545454545" cy="124.70510474336632" r="3" fill="#fff" stroke="#000"/><circle cx="154.63636363636363" cy="99.2586378249843" r="3" fill="#fff" stroke="#000"/><circle cx="213.8181818181818" cy="80.59844778755507" r="3" fill="#fff" stroke="#000"/><circle cx="292.72727272727275" cy="63.34312316559067" r="3" fill="#fff" stroke="#000"/><circle cx="391.3636363636364" cy="47.880610397045416" r="3" fill="#fff" stroke="#000"/><circle cx="490" cy="41.97970169902075" r="3" fill="#fff" stroke="#000"/><text x="498" y="45.97970169902075" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">no spare qubit</text><path d="M56,169.77700021079335 L95.45454545454545,153.72206710871436 L154.63636363636363,140.7600378454453 L213.8181818181818,132.498599979539 L292.72727272727275,124.70510474336632 L391.3636363636364,117.63174126205479 L490,112.22066708825335" fill="none" stroke="#000" stroke-width="2" /><circle cx="56" cy="169.77700021079335" r="3" fill="#000" stroke="#000"/><circle cx="95.45454545454545" cy="153.72206710871436" r="3" fill="#000" stroke="#000"/><circle cx="154.63636363636363" cy="140.7600378454453" r="3" fill="#000" stroke="#000"/><circle cx="213.8181818181818" cy="132.498599979539" r="3" fill="#000" stroke="#000"/><circle cx="292.72727272727275" cy="124.70510474336632" r="3" fill="#000" stroke="#000"/><circle cx="391.3636363636364" cy="117.63174126205479" r="3" fill="#000" stroke="#000"/><circle cx="490" cy="112.22066708825335" r="3" fill="#000" stroke="#000"/><text x="498" y="116.22066708825335" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">2 spare, exactly 6(c - 1)</text><text x="56" y="220" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Ratio by control count — 3: 1.2x, 5: 3.5x, 8: 6.0x, 11: 9.4x, 15: 14.1x, 20: 20.3x, 25: 20.8x.</text></g><text x="0" y="278" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The borrowed-qubit cost is exactly 6(c - 1) at every size; the ancilla-free path grows about c^2.4 to twenty controls,</text><text x="0" y="291" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">so the gap widens rather than holding at one factor.</text><text x="0" y="304" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Transpiled to the device's basis with no coupling map, so this is synthesis alone, before any routing.</text><text x="0" y="317" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The cost gap itself is long established — Barenco et al. 1995 give linear with borrowed work qubits against quadratic</text><text x="0" y="330" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">with none.</text></svg>
