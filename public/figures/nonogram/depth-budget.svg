<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" width="640" height="294" role="img" aria-label="Circuit depth against the depth a device runs before noise takes over. From 2x3 up a single round is deeper than the budget either way, so no whole round completes. At 2x2 one round of three fits. The 200-layer figure is a working assumption, not a number read off a device. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware. The oracle marks grids already known to satisfy the clues, so every quantum figure is a lower bound."><title>Circuit depth against the depth a device runs before noise takes over</title><desc>From 2x3 up a single round is deeper than the budget either way, so no whole round completes. At 2x2 one round of three fits. The 200-layer figure is a working assumption, not a number read off a device. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware. The oracle marks grids already known to satisfy the clues, so every quantum figure is a lower bound.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="294" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Circuit depth against the depth a device runs before noise takes over</text><g transform="translate(0,26)"><line x1="56" y1="10" x2="56" y2="130" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="56" y="144" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">100</text><line x1="210.66666666666666" y1="10" x2="210.66666666666666" y2="130" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="210.66666666666666" y="144" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">1,000</text><line x1="365.3333333333333" y1="10" x2="365.3333333333333" y2="130" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="365.3333333333333" y="144" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">10,000</text><line x1="520" y1="10" x2="520" y2="130" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="520" y="144" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">100,000</text><rect x="56" y="18" width="79.5833857447909" height="12" fill="#000" stroke="#000" stroke-width="1"/><rect x="56" y="31" width="98.28815284070639" height="12" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="50" y="34" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">2x2</text><text x="162.2881528407064" y="34" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">327 / 432 layers</text><rect x="56" y="56" width="187.4850161478121" height="12" fill="#000" stroke="#000" stroke-width="1"/><rect x="56" y="69" width="269.01714051032695" height="12" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="50" y="72" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">2x3</text><text x="333.01714051032695" y="72" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">1,630 / 5,487 layers</text><rect x="56" y="94" width="278.0095111391077" height="12" fill="#000" stroke="#000" stroke-width="1"/><rect x="56" y="107" width="416.90387441243223" height="12" fill="url(#stipple)" stroke="#000" stroke-width="1"/><text x="50" y="110" font-family="Geneva, Verdana, sans-serif" font-size="11" font-weight="400" fill="#000" text-anchor="end">3x3</text><text x="480.90387441243223" y="110" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">6,273 / 49,602 layers</text><line x1="102.55930599602911" y1="10" x2="102.55930599602911" y2="130" stroke="#000" stroke-width="2"/><text x="102.55930599602911" y="158" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">200 layers a device holds</text><text x="56" y="176" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">solid: spare qubits lent, stipple: nothing to borrow</text></g><text x="0" y="228" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">From 2x3 up a single round is deeper than the budget either way, so no whole round completes. At 2x2 one round of</text><text x="0" y="241" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">three fits.</text><text x="0" y="254" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The 200-layer figure is a working assumption, not a number read off a device.</text><text x="0" y="267" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a</text><text x="0" y="280" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">run on hardware.</text><text x="0" y="293" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The oracle marks grids already known to satisfy the clues, so every quantum figure is a lower bound.</text></svg>
