<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-label="Two-qubit gates per round, by what the oracle knows. Qiskit reduces the clue formula over its whole truth table into one marked grid per solution, so the usual figures price an oracle nobody could build without solving the puzzle first. The clue oracle carries one flag qubit per line and one gate per pattern that line allows. Boards with one solution, best of 8 seeds. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware."><title>Two-qubit gates per round, by what the oracle knows</title><desc>Qiskit reduces the clue formula over its whole truth table into one marked grid per solution, so the usual figures price an oracle nobody could build without solving the puzzle first. The clue oracle carries one flag qubit per line and one gate per pattern that line allows. Boards with one solution, best of 8 seeds. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="344" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Two-qubit gates per round, by what the oracle knows</text><g transform="translate(0,26)"><line x1="56" y1="164" x2="450" y2="164" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="168" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10</text><line x1="56" y1="114" x2="450" y2="114" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="118" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">100</text><line x1="56" y1="64" x2="450" y2="64" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="68" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">1,000</text><line x1="56" y1="14" x2="450" y2="14" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="18" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10,000</text><line x1="56" y1="14" x2="56" y2="164" stroke="#000"/><line x1="56" y1="164" x2="450" y2="164" stroke="#000"/><text x="56" y="178" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">2x2</text><text x="213.6" y="178" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">2x3</text><text x="450" y="178" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">3x3</text><path d="M56,100.99643060074627 L213.6,85.47285300590514 L450,68.34360446096389" fill="none" stroke="#000" stroke-width="2" /><circle cx="56" cy="100.99643060074627" r="4" fill="#000" stroke="#000"/><circle cx="213.6" cy="85.47285300590514" r="4" fill="#000" stroke="#000"/><circle cx="450" cy="68.34360446096389" r="4" fill="#000" stroke="#000"/><text x="460" y="72.34360446096389" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">tests the clues</text><path d="M56,140.14393726401687 L213.6,116.24769926385372 L450,99.99519555858308" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="56" cy="140.14393726401687" r="4" fill="#fff" stroke="#000"/><circle cx="213.6" cy="116.24769926385372" r="4" fill="#fff" stroke="#000"/><circle cx="450" cy="99.99519555858308" r="4" fill="#fff" stroke="#000"/><text x="460" y="103.99519555858308" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">marks the answers</text><path d="M56,135.58991379665025 L213.6,88.96988247154073 L450,61.180543565963035" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="56" cy="135.58991379665025" r="4" fill="#fff" stroke="#000"/><circle cx="213.6" cy="88.96988247154073" r="4" fill="#fff" stroke="#000"/><circle cx="450" cy="61.180543565963035" r="4" fill="#fff" stroke="#000"/><text x="460" y="52.180543565963035" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">marks them, nothing to borrow</text><text x="56" y="200" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">At 9 cells an oracle that reads the clues costs 4.3x one that already holds the answers, and holds</text><text x="56" y="213" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">17 qubits against 11.</text></g><text x="0" y="278" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Qiskit reduces the clue formula over its whole truth table into one marked grid per solution, so the usual figures</text><text x="0" y="291" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">price an oracle nobody could build without solving the puzzle first.</text><text x="0" y="304" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The clue oracle carries one flag qubit per line and one gate per pattern that line allows. Boards with one solution,</text><text x="0" y="317" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">best of 8 seeds.</text><text x="0" y="330" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a</text><text x="0" y="343" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">run on hardware.</text></svg>
