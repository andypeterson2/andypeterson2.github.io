<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 387" width="640" height="387" role="img" aria-label="Two-qubit gates per Grover round, against register size. The penalty for compiling without a spare qubit is not a constant: it widens from 1.2x at four qubits to 15.5x at 16. A single round over a one-solution oracle, seed 0, so these are structural counts rather than the best-of-seeds figures the cost table carries. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware. The oracle is written from the clues and compiled into one marked grid per solution, so every quantum figure is a lower bound."><title>Two-qubit gates per Grover round, against register size</title><desc>The penalty for compiling without a spare qubit is not a constant: it widens from 1.2x at four qubits to 15.5x at 16. A single round over a one-solution oracle, seed 0, so these are structural counts rather than the best-of-seeds figures the cost table carries. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a run on hardware. The oracle is written from the clues and compiled into one marked grid per solution, so every quantum figure is a lower bound.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="387" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Two-qubit gates per Grover round, against register size</text><g transform="translate(0,26)"><line x1="56" y1="194" x2="480" y2="194" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="198" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10</text><line x1="56" y1="134" x2="480" y2="134" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="138" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">100</text><line x1="56" y1="74" x2="480" y2="74" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="78" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">1,000</text><line x1="56" y1="14" x2="480" y2="14" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="18" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">10,000</text><line x1="56" y1="14" x2="56" y2="194" stroke="#000"/><line x1="56" y1="194" x2="480" y2="194" stroke="#000"/><text x="56" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">4</text><text x="126.66666666666667" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">6</text><text x="197.33333333333334" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">8</text><text x="268" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">10</text><text x="338.6666666666667" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">12</text><text x="409.3333333333333" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">14</text><text x="480" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">16</text><text x="268" y="222" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">qubits</text><path d="M56,159.9078965559803 L91.33333333333334,127.5674018211279 L126.66666666666667,105.02758498347477 L162,92.58823519828917 L197.33333333333334,78.63647252040441 L232.66666666666666,71.56385959315561 L268,60.856380053068335 L303.33333333333337,52.535340489177486 L338.6666666666667,44.84820022415994 L374,38.60302392045753 L409.3333333333333,32.85549568386418 L444.6666666666667,27.903919012907124 L480,23.48091172459317" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="126.66666666666667" cy="105.02758498347477" r="3" fill="#fff" stroke="#000"/><circle cx="232.66666666666666" cy="71.56385959315561" r="3" fill="#fff" stroke="#000"/><circle cx="338.6666666666667" cy="44.84820022415994" r="3" fill="#fff" stroke="#000"/><circle cx="444.6666666666667" cy="27.903919012907124" r="3" fill="#fff" stroke="#000"/><circle cx="480" cy="23.48091172459317" r="3" fill="#fff" stroke="#000"/><text x="488" y="27.48091172459317" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">nothing to borrow</text><path d="M56,165.37272471682024 L91.33333333333334,149.57823863034537 L126.66666666666667,133.74071757304145 L162,130.58570891981165 L197.33333333333334,119.41771707882233 L232.66666666666666,116.59792331824893 L268,112.98511889995024 L303.33333333333337,109.00156955970316 L338.6666666666667,105.72249733646368 L374,101.88235279743378 L409.3333333333333,99.28164740191568 L444.6666666666667,95.63081064388484 L480,94.8652195398006" fill="none" stroke="#000" stroke-width="2" /><circle cx="126.66666666666667" cy="133.74071757304145" r="3" fill="#000" stroke="#000"/><circle cx="232.66666666666666" cy="116.59792331824893" r="3" fill="#000" stroke="#000"/><circle cx="338.6666666666667" cy="105.72249733646368" r="3" fill="#000" stroke="#000"/><circle cx="444.6666666666667" cy="95.63081064388484" r="3" fill="#000" stroke="#000"/><circle cx="480" cy="94.8652195398006" r="3" fill="#000" stroke="#000"/><text x="488" y="98.8652195398006" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">2 spare qubits</text><path d="M56,172.29632983894442 L91.33333333333334,161.35591733898346 L126.66666666666667,153.67412852385695 L162,147.74887930147133 L197.33333333333334,142.92449907685548 L232.66666666666666,138.85531445743555 L268,135.33658368266913 L303.33333333333337,132.23697333888742 L338.6666666666667,129.46718231644815 L374,126.96372226065414 L409.3333333333333,124.67983775209629 L444.6666666666667,122.58009810978253 L480,120.637011731145" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="126.66666666666667" cy="153.67412852385695" r="3" fill="#fff" stroke="#000"/><circle cx="232.66666666666666" cy="138.85531445743555" r="3" fill="#fff" stroke="#000"/><circle cx="338.6666666666667" cy="129.46718231644815" r="3" fill="#fff" stroke="#000"/><circle cx="444.6666666666667" cy="122.58009810978253" r="3" fill="#fff" stroke="#000"/><circle cx="480" cy="120.637011731145" r="3" fill="#fff" stroke="#000"/><text x="488" y="124.637011731145" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">no routing (12n - 25)</text><text x="56" y="240" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Without routing the cost of a round is exactly 12n - 25 at every size measured. Routing onto the</text><text x="56" y="253" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">lattice multiplies that by 2.15 at six qubits and 2.69 at 16; refusing the spare qubits multiplies it</text><text x="56" y="266" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">by 3.0 and 15.5.</text></g><text x="0" y="308" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The penalty for compiling without a spare qubit is not a constant: it widens from 1.2x at four qubits to 15.5x at 16.</text><text x="0" y="321" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">A single round over a one-solution oracle, seed 0, so these are structural counts rather than the best-of-seeds</text><text x="0" y="334" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">figures the cost table carries.</text><text x="0" y="347" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3, qiskit 2.4.1. A fit to a device model, not a</text><text x="0" y="360" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">run on hardware.</text><text x="0" y="373" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">The oracle is written from the clues and compiled into one marked grid per solution, so every quantum figure is a</text><text x="0" y="386" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">lower bound.</text></svg>
