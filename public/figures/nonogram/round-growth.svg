<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" width="640" height="345" role="img" aria-label="Two-qubit gates per Grover round, against board size. Which side of exhaustive search the circuit grows on is decided by the decomposition, not by the search. Boards with one solution. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3. Three points over one 5-cell span: a slope, not a scaling law."><title>Two-qubit gates per Grover round, against board size</title><desc>Which side of exhaustive search the circuit grows on is decided by the decomposition, not by the search. Boards with one solution. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3. Three points over one 5-cell span: a slope, not a scaling law.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="345" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Two-qubit gates per Grover round, against board size</text><g transform="translate(0,26)"><line x1="56" y1="124.5875496314384" x2="490" y2="124.5875496314384" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="128.5875496314384" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">100</text><line x1="56" y1="39.58754963143841" x2="490" y2="39.58754963143841" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="43.58754963143841" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">1,000</text><line x1="56" y1="14" x2="56" y2="184" stroke="#000"/><line x1="56" y1="184" x2="490" y2="184" stroke="#000"/><text x="56" y="198" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">2x2</text><text x="229.6" y="198" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">2x3</text><text x="490" y="198" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="middle">3x3</text><path d="M56,169.0322429802671 L229.6,128.40863837998972 L490,100.77938208102965" fill="none" stroke="#000" stroke-width="2" /><circle cx="56" cy="169.0322429802671" r="4" fill="#000" stroke="#000"/><circle cx="229.6" cy="128.40863837998972" r="4" fill="#000" stroke="#000"/><circle cx="490" cy="100.77938208102965" r="4" fill="#000" stroke="#000"/><text x="500" y="104.77938208102965" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">spare qubits lent</text><path d="M56,161.29040308574383 L229.6,82.03634983305764 L490,34.79447369357558" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 3"/><circle cx="56" cy="161.29040308574383" r="4" fill="#fff" stroke="#000"/><circle cx="229.6" cy="82.03634983305764" r="4" fill="#fff" stroke="#000"/><circle cx="490" cy="34.79447369357558" r="4" fill="#fff" stroke="#000"/><text x="500" y="38.79447369357558" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">nothing to borrow</text><text x="56" y="222" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Per cell, over these boards: 1.283x with spare qubits, 1.532x without. Times the 1.414x the round</text><text x="56" y="235" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">count itself grows, that is 1.815 and 2.166, against 2x for exhaustive search.</text></g><text x="0" y="318" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Which side of exhaustive search the circuit grows on is decided by the decomposition, not by the search.</text><text x="0" y="331" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">Boards with one solution. FakeTorino (133 q, heavy-hex, basis cz/id/rz/sx/x), optimization level 3. Three points over</text><text x="0" y="344" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="start">one 5-cell span: a slope, not a scaling law.</text></svg>
