<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-label="Questions put to the clues, over every solvable board. Boards with one solution; the count under each label is how many there are. 5x5 is a 400,000-grid sample, one grid per puzzle, so it is unbiased at one solution. Exhaustive search is off the top of this axis: 512 checks at 3x3, 33.5 million at 5x5. A backtracking placement is at most one whole-grid check, so its count is an upper bound on its queries; Grover&#39;s round count is exact. Rounds come from the noiseless formula. Nothing here ran on a quantum device."><title>Questions put to the clues, over every solvable board</title><desc>Boards with one solution; the count under each label is how many there are. 5x5 is a 400,000-grid sample, one grid per puzzle, so it is unbiased at one solution. Exhaustive search is off the top of this axis: 512 checks at 3x3, 33.5 million at 5x5. A backtracking placement is at most one whole-grid check, so its count is an upper bound on its queries; Grover&#39;s round count is exact. Rounds come from the noiseless formula. Nothing here ran on a quantum device.</desc><defs><pattern id="stipple" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><rect width="1" height="1" fill="#000"/><rect x="2" y="2" width="1" height="1" fill="#000"/></pattern></defs><rect width="640" height="384" fill="#fff"/><text x="0" y="12" font-family="Geneva, Verdana, sans-serif" font-size="12" font-weight="700" fill="#000" text-anchor="start">Questions put to the clues, over every solvable board</text><g transform="translate(0,26)"><line x1="56" y1="204" x2="610" y2="204" stroke="#000" stroke-width="1" stroke-dasharray="1 3"/><text x="50" y="208" font-family="Geneva, Verdana, sans-serif" font-size="10" font-weight="400" fill="#000" text-anchor="end">1</text><line x1="56" y1="162.7141409807711" x2="610" y2="162.7141409807711" stroke="#000" stroke-width="1" s