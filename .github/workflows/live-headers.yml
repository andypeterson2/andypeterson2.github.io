name: Live security headers

# The build gate (ci.yml) checks the headers in dist/_headers; this verifies
# what the EDGE actually serves — a Cloudflare config drift, a Pages
# misdeploy, or a CDN-side change would pass the build gate and still strip
# CSP in production. Weekly + on demand; failures show up as a red run.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify edge headers on production
        run: bash scripts/check-security-headers.sh --live https://andypeterson.dev
