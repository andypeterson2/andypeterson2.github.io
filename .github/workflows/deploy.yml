name: Deploy to Cloudflare Pages

# Gated on CI: this runs only after the "CI" workflow finishes on main, and the
# job below is guarded on a successful conclusion — so a red build (lint, tests,
# CSP check, e2e, Lighthouse) cannot deploy.
# Deploy-on-every-push-to-main is preserved (CI itself runs on every such push).
# workflow_dispatch stays available for manual redeploys — but it verifies the
# commit has a successful CI run before shipping (no gate bypass).
#
# Deploy is wrangler-driven (prebuilt dist uploaded to Cloudflare Pages) rather
# than Cloudflare's git integration ON PURPOSE: the git integration builds and
# ships independently of this repo's CI, which would bypass its gates. Keeping
# the deploy inside the CI-gated workflow means nothing reaches production that
# CI hasn't validated.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write # stamp a deploy/cloudflare-pages commit status (green deployed / red skipped)

concurrency:
  group: cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run-triggered runs deploy only when CI passed AND the run came
    # from THIS repository. Without the head_repository check, a fork PR whose
    # source branch is named "main" satisfies `branches: [main]` and this job —
    # which holds CLOUDFLARE_API_TOKEN — would check out and build the fork's
    # code. Manual runs are verified against the commit's CI history below.
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed for this commit (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', head_sha: context.sha, per_page: 20,
            });
            const ok = runs.data.workflow_runs.some((r) => r.conclusion === 'success');
            if (!ok) {
              core.setFailed(
                `No successful CI run for ${context.sha.slice(0, 7)} — manual deploys only ship CI-validated commits. Run the CI workflow on this commit first.`,
              );
            }

      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI validated (falls back to the dispatched ref).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Public site identity — resolved into siteConfig at build (see
          # astro.config envPrefix). All values are public by design; set them as
          # repository *variables* (Settings ▸ Secrets and variables ▸ Actions ▸
          # Variables). Unset → the "Portfolio" fallback.
          SITE_DISPLAY_NAME: ${{ vars.SITE_DISPLAY_NAME }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL }}
          SITE_GITHUB: ${{ vars.SITE_GITHUB }}
          SITE_LINKEDIN: ${{ vars.SITE_LINKEDIN }}
          # Cloudflare Web Analytics beacon token (public). Set it as a repo *variable*
          # to ship the beacon; unset → no analytics script. See BaseLayout.astro.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Deploy dist to Cloudflare Pages
        # SHA-pinned (v3.9.0): this step receives CLOUDFLARE_API_TOKEN — a mutable
        # tag here would hand the token to whoever can retag the action repo.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          # Repo secrets. CLOUDFLARE_API_TOKEN: a scoped token with Account ▸
          # Cloudflare Pages ▸ Edit. CLOUDFLARE_ACCOUNT_ID: the account id.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=main marks this a PRODUCTION deployment (production branch =
          # main), so it publishes to the custom domain, not a preview URL.
          command: pages deploy dist --project-name=andypeterson-dev --branch=main

      - name: Stamp the commit as deployed
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: 'success', context: 'deploy/cloudflare-pages',
              description: 'Deployed to production',
            });

  # A workflow_run trigger whose CI did NOT pass means the deploy above was skipped.
  # Make that LOUD — a red commit status + a failing run — instead of a silent skip
  # that reads as "nothing happened" (which once got misread as "deployed").
  report-skipped:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Flag that production was NOT updated
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: run.head_sha,
              state: 'failure', context: 'deploy/cloudflare-pages',
              description: `Skipped — CI ${run.conclusion}; prod NOT updated`,
              target_url: run.html_url,
            });
            core.setFailed(`Deploy skipped: CI concluded '${run.conclusion}' for ${run.head_sha.slice(0,7)} — production was NOT updated.`);
