name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The portal is now a single standalone Astro app — each sub-app lives in its own
# repo with its own CI, and its built frontend is vendored under public/<app>/.
# So CI here only lints, tests, builds, and e2e-checks the portal (no submodules).
jobs:
  astro-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Vulnerability findings fail; an npm advisory-endpoint outage (it has had
      # multi-hour ones) becomes a loud warning — Dependabot alerts are the
      # continuous CVE channel, and blocking deploys on npmjs uptime is the
      # worse trade. Mirrors the gateway repo's audit gate.
      - name: npm audit (outage-tolerant)
        run: |
          out=""
          for attempt in 1 2 3; do
            out=$(npm audit --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            echo "npm audit attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          if echo "$out" | grep -q "audit endpoint returned an error"; then
            echo "::warning::npm audit skipped — registry advisory endpoint down (Dependabot alerts still cover CVEs)"
            exit 0
          fi
          exit 1
      # astro sync generates the env/content types the type-aware lint (unsafe-*
      # over src TS) needs; without them those types are error-typed and the rules
      # fire spuriously.
      - run: npx astro sync
      - run: npm run lint
      - name: Lint the Python helper scripts
        # Compatible-release pin — the enforced rule set must not float with
        # ruff releases (fleet lint baseline).
        run: pip install "ruff~=0.15.16" && ruff check .
      - run: npm run typecheck
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - run: npm run build
        env:
          # Public site identity: the same repository variables the production deploy
          # uses, so the tested build matches production. Unset → "Portfolio".
          SITE_DISPLAY_NAME: ${{ vars.SITE_DISPLAY_NAME }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_JOB_TITLE: ${{ vars.SITE_JOB_TITLE }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_EMAIL: ${{ vars.SITE_EMAIL }}
          SITE_GITHUB: ${{ vars.SITE_GITHUB }}
          SITE_LINKEDIN: ${{ vars.SITE_LINKEDIN }}
      - name: Verify CSP ships in built output
        run: bash scripts/check-security-headers.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 5

  e2e-tests:
    needs: astro-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # PR runs use chromium only (fast feedback); firefox/webkit run in full sweeps.
      - name: Install Playwright browser + system deps
        run: |
          # The runner ships pre-configured Microsoft apt repos (azure-cli, prod)
          # that intermittently serve an unsigned InRelease, which makes the
          # `apt-get update` inside `--with-deps` fail the whole job. Drop those
          # sources first; chromium's system deps come from the Ubuntu repos.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration-tests:
    # Post-build assertions on the actual dist/ artifact (CSP meta, project
    # routing, sitemap) — the same artifact the deploy workflow ships.
    needs: astro-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Run integration tests against the built artifact
        run: npx vitest run --config vitest.integration.config.ts

  contract-schemas:
    # The live-HTTP contract tests run in each app's own repo (they boot a backend).
    # The portal keeps the canonical written contract and verifies the schemas are
    # well-formed JSON Schemas — no backend needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate API-contract JSON Schemas
        run: |
          python3 - <<'PY'
          import glob, json, sys
          from jsonschema import Draft202012Validator
          bad = 0
          for f in sorted(glob.glob("docs/api-contract/schemas/*.json")):
              try:
                  Draft202012Validator.check_schema(json.load(open(f)))
                  print(f"ok  {f}")
              except Exception as e:
                  print(f"BAD {f}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  weights-sync:
    # The browser model weights are canonical in the classifier repo
    # (exports/web/, drift-checked by its CI) and shipped here by `make
    # sync-web` — a bare cp that nothing else verifies. This job closes the
    # silent-drift gap: if the classifier repo's canonical exports move and
    # the copies here don't, CI fails instead of the site serving stale
    # weights while both repos stay green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare served weights against the classifier repo's canonical exports
        env:
          EXPORTS: https://raw.githubusercontent.com/andypeterson2/quantum-machine-learning/main/exports/web
        run: |
          set -euo pipefail
          # The served files decide what to check, so a weights file added here is
          # covered the day it lands — no list to keep in step with the directory.
          drift=0
          unreachable=0
          for served in public/classifiers/models/*.json; do
            name=$(basename "$served")
            # curl exits non-zero on DNS/TLS/connection failure, which never reaches
            # an HTTP code. Catch that here so the outage branch below can run at all.
            code=$(curl -s --retry 3 --retry-delay 10 --retry-all-errors \
              -o "/tmp/$name" -w '%{http_code}' "$EXPORTS/$name") || code=000
            if [ "$code" = 404 ]; then
              echo "DRIFT: $served has no canonical export — it was renamed or removed upstream"
              drift=1
              continue
            fi
            if [ "$code" != 200 ]; then
              echo "could not fetch $name (HTTP $code)"
              unreachable=1
              continue
            fi
            if ! diff -q "/tmp/$name" "$served" >/dev/null; then
              echo "DRIFT: $served differs from the canonical export — run 'make sync-web' in quantum-machine-learning and commit"
              diff "/tmp/$name" "$served" || true
              drift=1
              continue
            fi
            echo "in sync: $name"
          done
          [ "$drift" = 0 ] || exit 1
          # Drift is a hard failure; raw.githubusercontent being down is not. An
          # outage must not block a deploy — the same trade the audit step makes.
          if [ "$unreachable" = 1 ]; then
            echo "::warning::some weights could not be compared — raw.githubusercontent unreachable"
          fi
      - name: Note any canonical export the site does not serve
        # Informational only: an export the portal has no page for is not a defect,
        # but it is worth seeing rather than discovering by accident.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh api repos/andypeterson2/quantum-machine-learning/contents/exports/web \
            --jq '.[] | select(.name | endswith(".json")) | .name' > /tmp/upstream.txt
          for name in $(cat /tmp/upstream.txt); do
            if [ ! -f "public/classifiers/models/$name" ]; then
              echo "::notice::$name is exported upstream but not served here"
            fi
          done

  lighthouse-desktop:
    needs: astro-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI (desktop)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          artifactName: lighthouse-desktop-results
          configPath: .lighthouserc.json

  lighthouse-mobile:
    needs: astro-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          artifactName: lighthouse-mobile-results
          configPath: .lighthouserc.mobile.json
