services:
  # ── Astro dev server (only with DEV profile) ───────────────────────
  # Backends are no longer part of this repo — run each app from its own clone
  # and point the portal at it with ?backend=… (see DEVELOPMENT.md).
  website:
    container_name: website
    profiles: ["dev"]
    image: node:22-slim
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    command: sh -c "npm install && npx astro dev --host 0.0.0.0 --port ${ASTRO_PORT:-4322}"
    ports:
      - "127.0.0.1:${ASTRO_PORT:-4322}:${ASTRO_PORT:-4322}"
    environment:
      SITE_URL: "http://localhost:${ASTRO_PORT:-4322}"
      NODE_ENV: development
    volumes:
      - .:/app
      - website_node_modules:/app/node_modules
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      # node:22-slim ships no curl/wget — probe with node's own fetch.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:'+(process.env.ASTRO_PORT||4322)).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M

volumes:
  website_node_modules:
