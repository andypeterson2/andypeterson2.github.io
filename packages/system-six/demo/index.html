<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>system-six demo</title>
    <script>
      try {
        if (localStorage.getItem('sm-theme') === 'dark')
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@sakun/system.css@0.1.11/dist/system.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../styles/styles.css" />
    <script type="module" src="../dist/system-six.esm.js"></script>
    <style>
      body {
        background: #fff;
        padding: 24px;
        font-family: var(--font-sans);
      }
      .row {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
        margin: 10px 0;
      }
      .cap {
        font-size: 11px;
        color: var(--color-text-muted);
        text-align: center;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      s6-window {
        display: block;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong style="font-family: var(--font-ui); font-size: 18px">system-six</strong>
      <s6-theme-toggle></s6-theme-toggle>
    </div>

    <s6-window title="Primitives" details="vanilla web components · light-DOM">
      <s6-section-rule>Chrome &amp; content</s6-section-rule>
      <p>
        A real <code>&lt;s6-window&gt;</code> — chrome from <code>system.css</code>, this body
        projected in. Use the toggle (top-right) for dark mode: the whole page inverts.
      </p>

      <s6-section-rule>Dither — 1-bit fills</s6-section-rule>
      <div class="row">
        <div>
          <s6-dither
            density="light"
            style="width: 100px; height: 52px; border: 2px solid var(--color-border)"
          ></s6-dither>
          <div class="cap">light</div>
        </div>
        <div>
          <s6-dither
            density="25"
            style="width: 100px; height: 52px; border: 2px solid var(--color-border)"
          ></s6-dither>
          <div class="cap">25</div>
        </div>
        <div>
          <s6-dither
            density="50"
            style="width: 100px; height: 52px; border: 2px solid var(--color-border)"
          ></s6-dither>
          <div class="cap">50</div>
        </div>
        <div>
          <s6-dither
            density="hatch"
            style="width: 100px; height: 52px; border: 2px solid var(--color-border)"
          ></s6-dither>
          <div class="cap">hatch</div>
        </div>
      </div>

      <s6-section-rule>Status — the only color</s6-section-rule>
      <div class="row">
        <s6-status state="success" label="Connected"></s6-status>
        <s6-status state="warning" label="Degraded"></s6-status>
        <s6-status state="danger" label="Compromised"></s6-status>
        <s6-status state="idle" label="Idle"></s6-status>
      </div>

      <s6-section-rule>Buttons</s6-section-rule>
      <div class="row">
        <s6-button>OK</s6-button>
        <s6-button disabled>Disabled</s6-button>
      </div>
    </s6-window>

    <s6-window title="Finder" details="/ desktop">
      <s6-icon-grid>
        <s6-finder-icon src="/icons/grid_light.svg" label="Nonogram" href="#"></s6-finder-icon>
        <s6-finder-icon src="/icons/code.svg" label="Résumé Editor" href="#"></s6-finder-icon>
        <s6-finder-icon src="/icons/export.svg" label="Export" href="#"></s6-finder-icon>
        <s6-finder-icon src="/icons/heart.svg" label="Home" href="#"></s6-finder-icon>
      </s6-icon-grid>
    </s6-window>
  </body>
</html>
